[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "nbqs-qst"
version = "0.1.0"
description = "Hardware-agnostic small-system quantum state tomography"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "array-api-compat>=1.6",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.optional-dependencies]
numpy = ["numpy>=1.26"]
jax = ["jax>=0.4.30"]
test = [
    "numpy>=1.26",
    "jax>=0.4.30",
    "pytest>=8",
]
example = [
    "numpy>=1.26",
    "jax>=0.4.30",
    "matplotlib>=3.8",
    "nbconvert>=7.16",
    "nbformat>=5.10",
    "ipykernel>=6.29",
]
dev = ["build>=1.2"]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false
include = ["nbqs_qst*"]

[tool.setuptools.package-data]
nbqs_qst = ["*.md"]
"nbqs_qst.state_generation" = ["*.md"]
"nbqs_qst.measurement_generation" = ["*.md"]
"nbqs_qst.state_reconstruction" = ["*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
