[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nbqst"
version = "0.1.0"
description = "Hardware-agnostic quantum state tomography and denoising toolkit"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
array-api = ["array-api-compat>=1.9"]
test = ["pytest>=7"]

[project.scripts]
nbqst = "nbqst.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

